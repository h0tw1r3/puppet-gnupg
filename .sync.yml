---
.gitlab-ci.yml:
  delete: true
appveyor.yml:
  delete: true
.travis.yml:
  delete: true

.rubocop.yml:
  default_configs:
    inherit_from: ".rubocop_todo.yml"
    AllCops:
      NewCops: enable
      Include:
        - "rakelib/*.rake"
      Exclude:
        - ".modules/**/*"
    Style/SingleLineMethods:
      Exclude:
        - "rakelib/test.rake"

Rakefile:
  default_disabled_lint_checks:
    - '140chars'
  changelog_max_issues: 500
  changelog_user: h0tw1r3
  changelog_since_tag: "1.5.1"
  changelog_version_tag_pattern: "%s"

spec/spec_helper.rb:
  coverage_report: true
spec/default_facts.yml:
  delete: true

Gemfile:
  optional:
    ':development':
      - gem: 'github_changelog_generator'
        version: '~> 1.15'
